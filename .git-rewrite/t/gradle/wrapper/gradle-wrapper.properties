# Gradle 发行包走国内镜像（华为云）。实测：镜像包的 sha256 与官方
# gradle-9.8.1-bin.zip.sha256 **完全一致**，可放心使用。
#
# 想切回官方源，把下面 distributionUrl 换成：
#   https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
#
# 版本由本文件（而不是 gradle.properties）控制；升级 Gradle 只需改 url 里的版本号。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-9.8.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# LimePlayer 版本目录
#
# ⚠️ 这里的每个版本号都是 2026-10-16 从**官方仓库的 maven-metadata** 实测取回的最新稳定版，
#    不是凭记忆写的。改之前请先复核 docs/02-技术规范.md §2.1 的三条规则：
#      1. KSP 自 2.x 起改为独立版本号（不再带 Kotlin 前缀），但仍受 Kotlin 版本约束；
#      2. Compose BOM 与 AGP 的最低版本要求取两者中较高者；
#      3. 依赖版本只写在本文件，模块脚本里不写死版本。

[versions]
# ---- 核心工具链 ----
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"

# ---- 代码生成插件（在对应任务里才启用，见 build.gradle.kts 注释）----
# 注意：AGP 9 起 Kotlin 编译已内置，「kotlin-android」插件必须不存在（官方迁移指南）
ksp = "2.3.12"
hilt = "2.60.1"

# ---- AndroidX / Compose ----
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
datastore = "1.2.1"
room = "2.8.5"
hiltNavigationCompose = "1.4.0"
media3 = "1.11.1"

# ---- 三方库 ----
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
coil = "3.6.3"
# 拼音：原计划的 TinyPinyin 只发在已关停的 JCenter 上（Maven Central 404，JitPack 也没有），
# 改用 pinyin4j（BSD，Central 可拉，单 jar）。备选 com.github.houbb:pinyin（Apache-2.0，
# 但会多带 heaven / nlp-common / pinyin4j 三个传递依赖）。最终在任务 3-5 定稿。
pinyin4j = "2.5.1"

# ---- 测试 ----
junit = "4.13.2"
truth = "1.4.5"
robolectric = "4.17"
turbine = "1.2.1"
androidxTestCore = "1.7.0"
androidxJunit = "1.3.0"

[libraries]
# AndroidX 基础
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Compose（版本由 BOM 统一管理，因此不加 version）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Google 官方图标集（Apache-2.0）：Material Icons Extended —— 替换自绘 Canvas 图标
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# 存储
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DI（KSP 接入时一起启用）
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# 播放（M2）
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# 网络与序列化
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# 图片（Coil 3：包名是 coil3.*，与 Coil 2 不同；归档参考实现里的写法要改，见 docs/reference/README.md）
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# 中文搜索拼音（M3）
pinyin4j = { module = "com.belerweb:pinyin4j", version.ref = "pinyin4j" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
